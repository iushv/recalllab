[project]
name = "recalllab"
version = "0.1.0.dev0"
description = "pytest for agent memory: turn memory expectations into pytest contracts that run in CI."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "Ayush Kumar", email = "contactayushkumarv@gmail.com" },
]
keywords = [
    "pytest",
    "agent",
    "memory",
    "llm",
    "testing",
    "ci",
    "regression",
    "langgraph",
    "mcp",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
mcp = ["fastmcp>=0.4"]
dashboard = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "jinja2>=3.1"]
all = [
    "langgraph>=0.2",
    "fastmcp>=0.4",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.scripts]
recalllab = "recalllab.cli.main:main"

[project.entry-points.pytest11]
recalllab = "recalllab.core.pytest_plugin.plugin"

[project.urls]
Homepage = "https://github.com/iushv/recalllab"
Repository = "https://github.com/iushv/recalllab"
Issues = "https://github.com/iushv/recalllab/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recalllab"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "ruff>=0.6",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP", "RUF", "SIM", "C4"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "examples.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests", "examples/tests"]
asyncio_mode = "auto"
markers = [
    "recalllab_optional: contract requires provider capabilities not present in the configured adapter",
]
