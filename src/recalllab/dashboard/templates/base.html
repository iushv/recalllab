<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}RecallLab Failure Gallery{% endblock %}</title>
    <style>
        :root { color-scheme: light; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", sans-serif;
            max-width: 1100px; margin: 2rem auto; padding: 0 1rem;
            color: #1a1a1a; background: #fafbfc;
        }
        h1 { margin: 0 0 0.25rem 0; font-size: 1.6rem; }
        h2 {
            border-bottom: 1px solid #ddd; padding-bottom: 0.4rem;
            margin-top: 2rem; font-size: 1.05rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em; color: #444;
        }
        h2 small { font-weight: 400; color: #888; text-transform: none; letter-spacing: 0; }
        header .tagline { color: #666; font-size: 0.95rem; margin-bottom: 1rem; }
        .breadcrumb { font-size: 0.9rem; color: #555; margin-bottom: 1rem; }
        .breadcrumb a { color: #0366d6; text-decoration: none; }
        .card {
            border: 1px solid #ddd; border-radius: 6px;
            padding: 0.85rem 1rem; margin: 0.6rem 0; background: #fff;
        }
        .card.failed { border-left: 4px solid #d73a49; }
        .card.skipped { border-left: 4px solid #b08800; background: #fffaeb; }
        .card.passed { border-left: 4px solid #28a745; }
        .card.error { border-left: 4px solid #6a737d; }
        .card .nodeid {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
            font-size: 0.88rem; color: #1a1a1a;
        }
        .card .meta { font-size: 0.8rem; color: #666; margin-top: 0.3rem; }
        .card .reason { margin-top: 0.45rem; font-size: 0.92rem; }
        .card .reason code, code.inline {
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
            font-size: 0.85rem; background: #f6f8fa;
            padding: 0.1rem 0.32rem; border-radius: 3px;
        }
        .empty { color: #888; font-style: italic; }
        a.detail-link {
            display: inline-block; margin-top: 0.45rem;
            font-size: 0.85rem; color: #0366d6; text-decoration: none;
        }
        a.detail-link:hover { text-decoration: underline; }
        table.events {
            width: 100%; border-collapse: collapse;
            background: #fff; border: 1px solid #ddd; border-radius: 6px; overflow: hidden;
        }
        table.events th, table.events td {
            text-align: left; padding: 0.55rem 0.75rem;
            border-bottom: 1px solid #eee;
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
            font-size: 0.83rem;
        }
        table.events th {
            background: #f6f8fa; font-weight: 600; color: #555;
            text-transform: uppercase; letter-spacing: 0.04em; font-size: 0.72rem;
        }
        table.events td.kind { color: #6f42c1; font-weight: 600; }
        table.events td.lat { color: #888; text-align: right; width: 5rem; }
        table.events tr.assert-fail td.kind { color: #d73a49; }
        .pill {
            display: inline-block; padding: 0.1rem 0.5rem; border-radius: 999px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.05em; vertical-align: middle; margin-right: 0.3rem;
        }
        .pill.failed { background: #ffeef0; color: #d73a49; }
        .pill.skipped { background: #fff8c5; color: #735c0f; }
        .pill.passed { background: #e6ffed; color: #22863a; }
        .pill.error { background: #f6f8fa; color: #444; }
    </style>
</head>
<body>
    <header>
        <h1>RecallLab Failure Gallery</h1>
        {% block tagline %}<div class="tagline">read-only view of <code class="inline">{{ trace_path }}</code></div>{% endblock %}
        {% block breadcrumb %}{% endblock %}
    </header>
    {% block content %}{% endblock %}
</body>
</html>
